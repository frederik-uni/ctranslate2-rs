[package]
name = "ct2rs"
version.workspace = true
authors.workspace = true
categories = ["api-bindings"]
documentation = "https://docs.rs/ct2rs"
edition.workspace = true
include = [
    "/include",
    "/src",
    "/LICENSE",
    "/examples",
    "/CTranslate2/CMakeLists.txt",
    "/CTranslate2/LICENSE",
    "/CTranslate2/cmake",
    "/CTranslate2/cpp",
    "/CTranslate2/include",
    "/CTranslate2/python",
    "/CTranslate2/src",
    "/CTranslate2/third_party",
    "!/CTranslate2/**/.*",
    "!/CTranslate2/**/test",
    "!/CTranslate2/**/docs",
    "!/CTranslate2/**/media",
]
keywords = ["ctranslate2", "bindings", "llm", "whisper"]
license.workspace = true
readme = "../README.md"
repository.workspace = true
description = "Rust bindings for OpenNMT/CTranslate2"

[dependencies]
ctranslate2-src = "0.1.1"
anyhow = "1.0"
cxx = { version = "1.0", features = ["c++17"] }
sentencepiece = { version = "0.12", optional = true }
tokenizers = { version = "0.22", optional = true }

# Dependencies for Whisper model
mel_spec = { version = "0.3", optional = true }
ndarray = { version = "0.16", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

# Dependencies for Hugging Face integration
hf-hub = { version = "0.4", optional = true }

[dev-dependencies]
clap = { version = "4.5", features = ["derive"] }
rand = "0.9"

# Dependencies for Whisper example
hound = { version = "3.5.1" }

[build-dependencies]
cmake = "0.1"
cxx-build = "1.0"
walkdir = "2.5"

[features]
default = ["all-tokenizers", "ruy", "cuda-small-binary"]
whisper = [
    "dep:mel_spec",
    "dep:ndarray",
    "dep:serde",
    "dep:serde_json",
    "all-tokenizers",
]
hub = ["dep:hf-hub"]

mkl = ["ctranslate2-src/mkl"]
openblas = ["ctranslate2-src/openblas"]
dnnl = ["ctranslate2-src/dnnl"]
ruy = ["ctranslate2-src/ruy"]
accelerate = ["ctranslate2-src/accelerate"]
openmp-runtime-comp = ["ctranslate2-src/openmp-runtime-comp"]
openmp-runtime-intel = ["ctranslate2-src/openmp-runtime-intel"]
msse4_1 = ["ctranslate2-src/msse4_1"]

# GPU / CUDA related
flash-attention = ["ctranslate2-src/flash-attention"]
tensor-parallel = ["ctranslate2-src/tensor-parallel"]
cuda-dynamic-loading = ["ctranslate2-src/cuda-dynamic-loading", "cuda"]
cuda-small-binary = ["ctranslate2-src/cuda-small-binary"]

# Futures to select tokenizers.
all-tokenizers = ["sentencepiece", "tokenizers"]
sentencepiece = ["dep:sentencepiece"]
tokenizers = ["dep:tokenizers"]

[[example]]
name = "bart"

[[example]]
name = "bloom"

[[example]]
name = "falcon"

[[example]]
name = "marian-mt"

[[example]]
name = "mpt"

[[example]]
name = "nllb"

[[example]]
name = "gpt-2"

[[example]]
name = "gpt-j"

[[example]]
name = "gpt-neox"

[[example]]
name = "opt"
required-features = ["tokenizers"]

[[example]]
name = "t5"

[[example]]
name = "stream"

[[example]]
name = "whisper"
required-features = ["whisper"]

[package.metadata.docs.rs]
features = ["whisper", "hub"]
cuda = ["ctranslate2-src/cuda"]
cudnn = ["ctranslate2-src/cudnn", "cuda"]
# Features to select backends.
